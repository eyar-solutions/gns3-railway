[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
pidfile=/var/run/supervisord.pid
user=root

; Virtual framebuffer — must start before x11vnc and GNS3 GUI
[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=100
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.log

; VNC server — waits for the display to be ready before binding
[program:x11vnc]
command=/bin/bash -c "until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.5; done; exec x11vnc -display :1 -nopw -listen 127.0.0.1 -xkb -forever -shared"
autorestart=true
priority=200
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.log

; noVNC — bridges WebSocket to VNC, listens on $PORT (Railway injects this)
[program:novnc]
command=/bin/bash -c "exec websockify --web=/usr/share/novnc ${PORT:-6080} 127.0.0.1:5900"
autorestart=true
priority=300
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.log

; GNS3 server — the network simulation backend
[program:gns3server]
command=gns3server --config /etc/gns3/gns3_server.conf --host 0.0.0.0 --port 3080
autorestart=true
priority=400
stdout_logfile=/var/log/gns3server.log
stderr_logfile=/var/log/gns3server.log

; GNS3 GUI — waits for the server API to be up before launching
[program:gns3gui]
command=/bin/bash -c "until curl -sf http://localhost:3080/v2/version >/dev/null 2>&1; do sleep 1; done; exec gns3"
environment=DISPLAY=":1",HOME="/root",XDG_RUNTIME_DIR="/tmp/runtime-root"
autorestart=true
priority=500
stdout_logfile=/var/log/gns3gui.log
stderr_logfile=/var/log/gns3gui.log
